# Financial Twin v2.0 — household scenario.
#
# Roth/standard split: model a single vehicle as two account entries
# (e.g. husband_401k_traditional + husband_401k_roth) tagged with the
# same `vehicle_group`. The IRS combined limit is the sum of the two
# `contribution_2026` values (the engine does NOT enforce this; you
# allocate dollars between the two halves).
#
# Defined employer match: set `employer_match_pct` and (optionally)
# `employer_match_max_pct`. The engine pays
#   match = owner_salary * min(employer_match_pct, employer_match_max_pct,
#                              employee_contribution_pct)
# only on the *traditional* portion below by convention; if your employer
# matches Roth contributions too, set the same fields on the Roth entry.

people:
  - name: husband        # TODO: real first name
    birth_year: 1985
    retirement_year: 2050
    salary_2026: 110000.0  # TODO
    salary_growth: 0.025
    pia_monthly: 2800.0    # TODO: pull from SSA statement
    ss_claim_age: 67

  - name: wife
    birth_year: 1986
    retirement_year: 2046
    salary_2026: 50000.0       # 20-hr "steady" wage today; TODO
    fte_salary_2026: 100000.0  # what the 40-hr "sprint" pay would be; TODO
    salary_growth: 0.025
    pia_monthly: 1900.0         # TODO
    ss_claim_age: 67
    wife_phase: steady           # set to "sprint" to model a 5-year FTE finish

accounts:
  # ---- Husband 401k (split between Traditional and Roth) ----
  - name: husband_401k_traditional
    behavior: stochastic_market
    balance_2026: 220000.0       # TODO
    tax_type: pre_tax
    contribution_limit_2026: 24000.0   # IRS 2026 combined cap (shared with Roth half)
    contribution_2026: 18000.0   # TODO: pre-tax portion you contribute
    employer_match_pct: 0.05     # 5% of salary; employer match always lands here
    employer_match_max_pct: 0.05
    vehicle_group: husband_401k
    stocks_weight: 0.85
    waterfall_priority: 3
    owner: husband

  - name: husband_401k_roth
    behavior: stochastic_market
    balance_2026: 30000.0        # TODO
    tax_type: roth
    contribution_limit_2026: 24000.0   # shared with traditional half
    contribution_2026: 6000.0    # TODO: Roth portion you contribute
    vehicle_group: husband_401k
    stocks_weight: 0.85
    waterfall_priority: 3
    owner: husband

  # ---- Wife 457 (split between Traditional and Roth) ----
  - name: wife_457_traditional
    behavior: stochastic_market
    balance_2026: 60000.0        # TODO
    tax_type: pre_tax
    contribution_limit_2026: 24000.0
    contribution_2026: 8000.0    # TODO
    employer_match_pct: 0.04     # TODO: 457 match if any
    employer_match_max_pct: 0.04
    vehicle_group: wife_457
    stocks_weight: 0.8
    waterfall_priority: 2
    owner: wife

  - name: wife_457_roth
    behavior: stochastic_market
    balance_2026: 10000.0        # TODO
    tax_type: roth
    contribution_limit_2026: 24000.0
    contribution_2026: 2000.0    # TODO
    vehicle_group: wife_457
    stocks_weight: 0.8
    waterfall_priority: 2
    owner: wife

  # ---- Roth IRAs (each spouse, separate IRS limit) ----
  - name: husband_roth_ira
    behavior: stochastic_market
    balance_2026: 45000.0        # TODO
    tax_type: roth
    contribution_limit_2026: 7000.0
    contribution_2026: 7000.0
    stocks_weight: 0.85
    waterfall_priority: 4
    owner: husband

  - name: wife_roth_ira
    behavior: stochastic_market
    balance_2026: 30000.0        # TODO
    tax_type: roth
    contribution_limit_2026: 7000.0
    contribution_2026: 7000.0
    stocks_weight: 0.85
    waterfall_priority: 4
    owner: wife

  # ---- Wife VEBA (employer-funded, healthcare-only triple-exempt) ----
  - name: wife_veba
    behavior: stochastic_market
    balance_2026: 8000.0         # TODO
    tax_type: triple_exempt
    contribution_limit_2026: 1e9   # employer-funded; no IRS cap on user side
    contribution_2026: 0.0         # set to expected employer VEBA deposit
    employer_match_2026: 1500.0    # flat $ employer deposit; TODO
    stocks_weight: 0.5
    waterfall_priority: 1
    owner: wife

  # ---- Wife TCDRS (frozen Texas service; 7% credited Dec 31 on Jan 1 balance) ----
  - name: wife_tcdrs
    behavior: fixed_deferred
    balance_2026: 75000.0        # TODO
    annual_rate: 0.07
    is_taxable: false
    contribution_2026: 0.0       # non-vested or frozen; no further contributions
    interest_on_jan1_only: true

  # ---- Wife PERS (Oregon OPSRP General defined benefit) ----
  - name: wife_pers
    behavior: defined_benefit
    owner: wife
    formula_multiplier: 0.015
    fas_years: 5
    service_start_year: 2026     # TODO: actual hire year if before 2026
    service_end_year: 2046       # = retirement_year
    cola_rate: 0.02
    survivor_fraction: 0.5

  # ---- Kid1 529 ----
  - name: kid1_529
    behavior: education_529_glidepath
    balance_2026: 25000.0        # TODO
    contribution_2026: 5000.0    # TODO; first $360 of joint contribs gets OR credit
    beneficiary_birth_year: 2018  # TODO
    college_start_age: 18
    annual_tuition_2026: 28000.0 # TODO
    college_years: 4

  # ---- Family HYSA (taxable cash savings) ----
  - name: family_hysa
    behavior: fixed_deferred
    balance_2026: 50000.0        # TODO
    annual_rate: 0.04
    is_taxable: true
    contribution_2026: 6000.0    # TODO: net annual savings into HYSA
    interest_on_jan1_only: false

  # ---- Family HSA (triple-exempt) ----
  - name: family_hsa
    behavior: stochastic_market
    balance_2026: 35000.0        # TODO
    tax_type: triple_exempt
    contribution_limit_2026: 8500.0
    contribution_2026: 8500.0
    employer_match_2026: 0.0
    stocks_weight: 0.7
    waterfall_priority: 1
    owner: husband

  # ---- Taxable brokerage (target of post-mortgage lifestyle split) ----
  - name: brokerage
    behavior: stochastic_market
    balance_2026: 120000.0       # TODO
    tax_type: taxable
    contribution_limit_2026: 1e9
    contribution_2026: 0.0
    stocks_weight: 0.8
    waterfall_priority: 99
    owner: husband

mortgage:
  principal_remaining_2026: 320000.0   # TODO
  annual_rate: 0.035                   # TODO
  monthly_payment: 1850.0              # TODO: P&I only (exclude tax/insurance)
  payoff_year: 2046                    # TODO
  lifestyle_split_brokerage_account: brokerage

house:
  assessed_value_2026: 450000.0        # TODO: AV per Clackamas tax statement
  market_value_2026: 700000.0          # TODO: realistic market value
  measure50_growth_cap: 0.03
  millage_rate: 0.015                  # TODO: combined millage from your bill
  solar_premium_excluded_av: 25000.0   # TODO: solar improvement value excluded under M50

expenses:
  standard_annual_2026: 75000.0        # TODO: non-mortgage living expenses
  discretionary_annual_2026: 12000.0   # TODO

healthcare:
  bridge_annual_premium_2026: 18000.0  # TODO: ACA premium between retirement and 65
  medicare_supplement_annual_2026: 6000.0  # TODO: post-65 supplement + Part B

tax:
  filing_status: mfj
  inflation_rate: 0.025
  metro_shs_threshold_2026: 205000.0
  metro_shs_rate: 0.01
  state_credit_529_max: 360.0
  federal_ltcg_rate: 0.15
  state_ltcg_as_ordinary: true

simulation:
  n_runs: 1000
  start_year: 2026
  horizon_to_age: 95
  seed: 20260424
  stocks_bonds_correlation: 0.05
  rmd_start_age: 73
