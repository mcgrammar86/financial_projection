[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial_twin"
version = "2.0.0"
description = "Monte Carlo household financial simulator (Oregon/Clackamas tax engine, behavior-organized accounts)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "polars>=0.20",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "streamlit>=1.30",
    "plotly>=5.18",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "pytest-regressions>=2.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
